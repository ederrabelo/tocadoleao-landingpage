            "@type": "Question",

            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. Iniciantes podem fazer a primeira aula com ou sem kimono. Use uma roupa confortável, sem zíper ou detalhes que possam machucar, mantenha as unhas cortadas e traga uma garrafinha de água."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso estar em forma para começar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. A aula introdutória permite conhecer os fundamentos no seu ritmo. O condicionamento evolui gradualmente com a prática."
            }
          },
          {
            "@type": "Question",
            "name": "Tenho uma lesão ou restrição física. Posso treinar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Depende da condição. Avise nossa equipe antes da aula e informe o professor. Em alguns casos, a orientação médica é recomendada antes de iniciar."
            }
          },
          {
            "@type": "Question",
            "name": "Preciso competir para treinar Jiu-Jitsu?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Não. Você pode treinar para melhorar o condicionamento, aprender defesa pessoal e praticar uma atividade física. A competição é uma possibilidade, não uma obrigação."
            }
          },
          {
            "@type": "Question",
            "name": "Os responsáveis podem acompanhar a aula Kids?",
